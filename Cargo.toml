[package]
name = "tui-minesweeper"
version = "0.1.1"
edition = "2024"
description = "Terminal Minesweeper with no-guess boards"
license = "MIT"
repository = "https://github.com/rtabulov/tui-minesweeper"
readme = "README.md"
keywords = ["minesweeper", "tui", "terminal", "game"]
categories = ["games", "command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
directories = "6"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
