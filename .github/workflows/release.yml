name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.npm_platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            npm_platform: linux-x64
            artifact_bin: tui-minesweeper
          - runner: ubuntu-24.04-arm
            npm_platform: linux-arm64
            artifact_bin: tui-minesweeper
          - runner: macos-14
            npm_platform: darwin-arm64
            artifact_bin: tui-minesweeper
          - runner: macos-15-intel
            npm_platform: darwin-x64
            artifact_bin: tui-minesweeper
          - runner: windows-2022
            npm_platform: win32-x64
            artifact_bin: tui-minesweeper.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.npm_platform }}
          path: target/release/${{ matrix.artifact_bin }}
          if-no-files-found: error

  publish:
    name: Publish npm, crates.io, GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z, got: $TAG"
            exit 1
          fi
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "Cargo.toml version ($CARGO_VERSION) != tag version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          pattern: binary-*
          merge-multiple: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install Rust (crates.io publish)
        uses: dtolnay/rust-toolchain@stable

      - name: Pack platform packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir -p npm/dist
          while IFS=$'\t' read -r platform bin; do
            src="${ARTIFACTS}/binary-${platform}/${bin}"
            test -f "$src"
            node npm/scripts/pack-platform.cjs \
              --platform "$platform" \
              --version "$VERSION" \
              --binary "$src" \
              --out npm/dist
          done < <(node npm/scripts/list-platforms.cjs)

      - name: Sync meta package version
        run: node npm/scripts/set-version.cjs "${{ steps.ver.outputs.version }}"

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Empty NODE_AUTH_TOKEN => OIDC trusted publishing (do not export a blank token).
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            unset NODE_AUTH_TOKEN
          fi
          publish_if_new() {
            local dir="$1"
            local name version
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skip ${name}@${version} (already on npm)"
              return 0
            fi
            echo "Publishing ${name}@${version}..."
            npm publish --access public
          }
          shopt -s nullglob
          for dir in npm/dist/minesweeper-*; do
            pushd "$dir" >/dev/null
            publish_if_new "$dir"
            popd >/dev/null
          done
          pushd npm/minesweeper >/dev/null
          publish_if_new .
          popd >/dev/null

      - name: Authenticate to crates.io (OIDC)
        id: crates_auth
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: |
          set -euo pipefail
          TOKEN="${CARGO_REGISTRY_TOKEN:-}"
          if [[ -z "$TOKEN" ]]; then
            TOKEN="${{ steps.crates_auth.outputs.token }}"
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "No crates.io token/OIDC. Bootstrap: cargo publish locally once, then enable trusted publishing."
            exit 1
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if cargo search tui-minesweeper --limit 1 2>/dev/null | grep -q "^tui-minesweeper = \"${VERSION}\""; then
            echo "Skip crates.io tui-minesweeper@${VERSION} (already published)"
            exit 0
          fi
          CARGO_REGISTRY_TOKEN="$TOKEN" cargo publish --locked

      - name: Stage GitHub Release assets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS=$'\t' read -r platform bin; do
            src="${ARTIFACTS}/binary-${platform}/${bin}"
            if [[ "$bin" == *.exe ]]; then
              dest="release-assets/tui-minesweeper-${VERSION}-${platform}.exe"
            else
              dest="release-assets/tui-minesweeper-${VERSION}-${platform}"
            fi
            cp "$src" "$dest"
            chmod +x "$dest" || true
          done < <(node npm/scripts/list-platforms.cjs)
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
